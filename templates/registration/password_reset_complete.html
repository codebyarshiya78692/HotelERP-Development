{% extends "base.html" %}

{% block title %}
IDDS | Password Reset Complete
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-shell">

        <div class="auth-card">

            <div class="auth-icon">
                ✓
            </div>

            <p class="eyebrow">
                ACCOUNT RECOVERY
            </p>

            <h1>
                Password updated
            </h1>

            <p class="auth-subtitle">
                Your password has been successfully reset.
                You can now sign in with your new password.
            </p>

            <div class="auth-links">

                <a href="{% url 'accounts:login' %}">
                    Sign in to IDDS
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
