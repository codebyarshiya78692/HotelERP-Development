{% extends "base.html" %}

{% block title %}
IDDS | Check Your Email
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-shell">

        <div class="auth-card">

            <div class="auth-icon">
                ✉️
            </div>

            <p class="eyebrow">
                EMAIL SENT
            </p>

            <h1>
                Check your email
            </h1>

            <p class="auth-subtitle">
                If an IDDS account exists for that email address,
                we've sent a secure password-reset link.
            </p>

            <div class="auth-links">

                <a href="{% url 'accounts:login' %}">
                    Return to sign in
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
